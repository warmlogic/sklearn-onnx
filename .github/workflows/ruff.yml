name: Ruff
on: [push, pull_request]
jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.1"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.1"
          args: "format --check --diff"
